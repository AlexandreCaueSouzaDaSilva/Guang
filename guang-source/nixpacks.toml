[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = ["corepack enable", "corepack prepare pnpm@latest --activate", "pnpm install --no-frozen-lockfile"]

[phases.build]
cmds = ["pnpm --filter ./artifacts/api-server run build"]

[start]
cmd = "pnpm --filter ./artifacts/api-server run start"