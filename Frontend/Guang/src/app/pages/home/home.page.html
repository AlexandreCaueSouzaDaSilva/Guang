<ion-content [fullscreen]="true">

  <div class="topbar">
    <span class="app-title">Guang Project</span>
    <button class="avatar-btn" routerLink="/config">
      <ion-icon name="person-outline"></ion-icon>
    </button>
  </div>

  <div class="section-label">nova transcrição</div>

  <div class="upload-area">
    <div class="upload-icon">
      <ion-icon name="image-outline"></ion-icon>
    </div>
    <p>Toque para selecionar imagem</p>
    <span>JPG, PNG, PDF</span>
  </div>

  <div class="divider-row">
    <div class="divider-line"></div>
    <span class="divider-text">ou</span>
    <div class="divider-line"></div>
  </div>

  <button class="camera-btn">
    <ion-icon name="camera-outline"></ion-icon>
    Usar câmera
  </button>

  <div class="recent-row">
    <span class="section-label">recentes</span>
    <span class="see-all" routerLink="/notebooks">Ver todos</span>
  </div>

  <div class="chips-row">
    <div class="chip" *ngFor="let item of recentes">
      <div class="chip-thumb"></div>
      <p>{{ item.nome }}</p>
      <span>{{ item.tempo }}</span>
    </div>
  </div>

  <button class="transcribe-btn" routerLink="/resultado">
    <ion-icon name="mic-outline"></ion-icon>
    Transcrever
  </button>

</ion-content>
