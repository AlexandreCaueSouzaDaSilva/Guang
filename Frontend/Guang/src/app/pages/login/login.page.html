<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>GUANG</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Guang</ion-title>
    </ion-toolbar>
  </ion-header>

  <h2 style="text-align:center;">Login</h2>

  <ion-item>
    <ion-label position="floating">Username</ion-label>
    <ion-input type="text" placeholder="Enter username"></ion-input>
  </ion-item>

  <ion-item>
    <ion-label position="floating">Password</ion-label>
    <ion-input type="password" placeholder="Enter password"></ion-input>
  </ion-item>

  <ion-button expand="block" color="primary" class="ion-margin-top">
    Login
  </ion-button>

  <div style="text-align:center; margin-top:20px;">
    <p>Você não tem uma conta? <a href="/register">Sign up</a></p>

    <p>Esqueci minha senha? <a href="#">Recuperar senha</a></p>
  </div>
</ion-content>
